# railway.toml — SmartTutor backend deployment configuration
# Docs: https://docs.railway.com/reference/config-as-code

[build]
# Use the Dockerfile in this directory (backend/ is the Railway root directory)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand is intentionally omitted — the Dockerfile CMD handles
# alembic migrations + uvicorn startup via sh -c (Railway pattern).

# Railway polls /health every 30 s during rollout; deploy is only marked
# successful once this returns HTTP 200.
healthcheckPath = "/health"
healthcheckTimeout = 300  # 5 min — crewai/chromadb imports are slow on cold start

# Restart policy: auto-restart on non-zero exit, up to 3 times in 5 minutes
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
